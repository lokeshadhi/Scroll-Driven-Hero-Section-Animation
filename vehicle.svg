<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <!-- Metallic & Neon Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="65%" stop-color="#00f5d4" />
      <stop offset="90%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cockpitShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="wheelCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
  </defs>

  <!-- Ambient Underglow Shadow -->
  <ellipse cx="260" cy="148" rx="230" ry="20" fill="#00ff88" opacity="0.3" filter="url(#neonGlow)" />
  <ellipse cx="260" cy="150" rx="220" ry="12" fill="#000000" opacity="0.75" />

  <!-- Rear Wing & Aero Supports -->
  <path d="M40 70 L95 70 L85 52 L30 52 Z" fill="#0b0f19" stroke="#00ff88" stroke-width="2" />
  <rect x="52" y="70" width="8" height="24" fill="#1e293b" rx="2" />
  <rect x="78" y="70" width="8" height="24" fill="#1e293b" rx="2" />

  <!-- Aerodynamic Hypercar Body -->
  <path d="M35 130 
           C50 128, 65 110, 105 110 
           L160 88 
           C205 60, 295 56, 365 82 
           L440 102 
           C475 110, 500 122, 505 130 
           C500 140, 480 142, 440 142 
           L415 142 
           C410 118, 355 118, 350 142 
           L175 142 
           C170 118, 115 118, 110 142 
           L45 142 
           C32 140, 28 134, 35 130 Z" 
        fill="url(#bodyGrad)" stroke="#00ff88" stroke-width="2" />

  <!-- Canopy / Cockpit Windshield & Glass -->
  <path d="M180 88 
           C220 66, 290 64, 345 84 
           L400 100 
           C365 100, 260 98, 195 98 Z" 
        fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" />
  
  <path d="M190 89 C225 70, 285 68, 335 86 Z" fill="url(#cockpitShine)" />

  <!-- Window Pillar Structure -->
  <line x1="275" y1="69" x2="285" y2="98" stroke="#090d16" stroke-width="3.5" />

  <!-- Flow Lines & Neon Accents -->
  <path d="M190 110 C250 106, 320 108, 390 118" fill="none" stroke="#00ff88" stroke-width="2.5" filter="url(#neonGlow)" />
  <path d="M210 122 C260 120, 310 123, 345 133" fill="none" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Laser Headlights (Front Face) -->
  <polygon points="480,114 502,123 490,128 470,120" fill="#e0f2fe" filter="url(#neonGlow)" />
  <line x1="500" y1="124" x2="518" y2="127" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)" />
  <polygon points="496,121 518,125 502,131" fill="#00f5d4" opacity="0.9" filter="url(#neonGlow)" />

  <!-- Rear Cyber Taillight Matrix -->
  <path d="M35 125 L52 123 L48 130 L35 132 Z" fill="#ef4444" filter="url(#neonGlow)" />
  <line x1="25" y1="128" x2="48" y2="128" stroke="#f43f5e" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- Front Wheel System -->
  <circle cx="382" cy="142" r="28" fill="#05070a" stroke="#334155" stroke-width="3.5" />
  <circle cx="382" cy="142" r="21" fill="#0f172a" stroke="#00ff88" stroke-width="2.5" />
  <circle cx="382" cy="142" r="9" fill="url(#wheelCore)" />
  <!-- Dynamic Spokes -->
  <line x1="382" y1="121" x2="382" y2="163" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="361" y1="142" x2="403" y2="142" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="367" y1="127" x2="397" y2="157" stroke="#00ff88" stroke-width="2" />
  <line x1="367" y1="157" x2="397" y2="127" stroke="#00ff88" stroke-width="2" />

  <!-- Rear Wheel System -->
  <circle cx="142" cy="142" r="28" fill="#05070a" stroke="#334155" stroke-width="3.5" />
  <circle cx="142" cy="142" r="21" fill="#0f172a" stroke="#00ff88" stroke-width="2.5" />
  <circle cx="142" cy="142" r="9" fill="url(#wheelCore)" />
  <!-- Dynamic Spokes -->
  <line x1="142" y1="121" x2="142" y2="163" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="121" y1="142" x2="163" y2="142" stroke="#94a3b8" stroke-width="2.5" />
  <line x1="127" y1="127" x2="157" y2="157" stroke="#00ff88" stroke-width="2" />
  <line x1="127" y1="157" x2="157" y2="127" stroke="#00ff88" stroke-width="2" />

  <!-- Front Aero Splitter & Rear Carbon Diffuser -->
  <path d="M475 140 L514 140 L510 145 L470 145 Z" fill="#00ff88" />
  <path d="M42 140 L70 140 L65 145 L35 145 Z" fill="#1e293b" />
</svg>
